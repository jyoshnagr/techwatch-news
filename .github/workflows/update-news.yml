name: Update news feed

on:
  schedule:
    # Runs daily at 07:00 UTC. Edit the cron expression to change the time.
    - cron: "0 7 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch news
        run: npm run fetch

      - name: Commit updated data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "Update news feed $(date -u +'%Y-%m-%d')"
          git push
